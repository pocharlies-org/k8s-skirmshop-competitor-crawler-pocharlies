apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: competitor-crawler-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: competitor-crawler-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/skirmshop/competitor-crawler
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: competitor-crawler-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: competitor-crawler-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: secret/skirmshop/labels
        property: DB_USER
    - secretKey: password
      remoteRef:
        key: secret/skirmshop/labels
        property: DB_PASSWORD
