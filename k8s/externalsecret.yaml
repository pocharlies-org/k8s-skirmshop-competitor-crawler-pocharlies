apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: competitor-crawler-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: competitor-crawler-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/skirmshop/competitor-crawler
