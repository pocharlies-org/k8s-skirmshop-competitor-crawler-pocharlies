apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: competitor-crawler-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: competitor-crawler-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # BRAIN_API_KEY is sourced from the Brain's own KV mount (skirmshop-brain),
    # property dashboard_api_key, matching how other Skirmshop services
    # authenticate against the Brain push-ingest API. The crawler consumes this
    # via `envFrom secretRef competitor-crawler-secrets` (manifest.yaml), so the
    # synced Secret key MUST be literally BRAIN_API_KEY.
    - secretKey: BRAIN_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: skirmshop-brain/prod/app
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: dashboard_api_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: competitor-crawler-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: competitor-crawler-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: secret/skirmshop/labels
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: DB_USER
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: secret/skirmshop/labels
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: DB_PASSWORD
