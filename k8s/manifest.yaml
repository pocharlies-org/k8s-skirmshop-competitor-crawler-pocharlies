apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmshop-competitor-crawler
  labels:
    app.kubernetes.io/name: skirmshop-competitor-crawler
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: skirmshop-competitor-crawler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skirmshop-competitor-crawler
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: crawler
          image: harbor.e-dani.com/homelab/skirmshop-competitor-crawler@sha256:ccab2c1508c38cb133a01594c11b5a926673dab660e4e6ca9a9c1b0822cc6193
          imagePullPolicy: IfNotPresent
          env:
            - name: BRAIN_URL
              value: http://skirmshop-brain-ingest.skirmshop-brain-prod.svc.cluster.local
            - name: BRAIN_INSTANCE
              value: skirmshop
            - name: FIRECRAWL_URL
              value: http://firecrawl-api.skirmshop.svc.cluster.local:3002
            - name: PUSH_BATCH_SIZE
              value: "20"
            - name: LOG_LEVEL
              value: INFO
            - name: REQUIRE_BRAIN_API_KEY
              value: "true"
            - name: HISTORY_ENABLED
              value: "true"
            - name: PGHOST
              value: postgres-shared-rw.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: competitor_intel
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: competitor-crawler-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: competitor-crawler-db-credentials
                  key: password
          envFrom:
            - secretRef:
                name: competitor-crawler-secrets
                optional: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
