apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmshop-stock-prober
  labels:
    app.kubernetes.io/name: skirmshop-stock-prober
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: skirmshop-stock-prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skirmshop-stock-prober
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: prober
          image: harbor.e-dani.com/homelab/skirmshop-competitor-crawler@sha256:b5ceac612a5a71f614756efe4be99438b403491efc5b624ce14ae528cd9bc697
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - src.prober.run_once
          args:
            - --targets
            - /app/prober-targets/targets.json
          env:
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            - secretRef:
                name: competitor-crawler-secrets
                optional: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
